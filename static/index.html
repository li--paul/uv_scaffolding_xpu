<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTX-2.5 Video Generation</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2233; --border: #2c3a55; --fg: #e6edf5;
    --muted: #8fa3bd; --accent: #4f9cf7; --accent2: #7c5cf0; --ok: #3ecf8e;
    --err: #ff6b6b; --warn: #ffc94d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: radial-gradient(1200px 600px at 20% -10%, #182036, var(--bg));
    color: var(--fg); min-height: 100vh;
  }
  header { padding: 20px 28px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 28px 60px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 18px;
  }
  .card h2 { margin: 0 0 14px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  textarea, select, input {
    width: 100%; background: #0d1220; color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-family: inherit; font-size: 13px; resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }
  .mode-group { display: flex; gap: 10px; margin-top: 4px; }
  .mode-card {
    flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    cursor: pointer; background: #141b2c; transition: border-color .15s, background .15s;
  }
  .mode-card.selected { border-color: var(--accent); background: #16233a; }
  .mode-card input { display: none; }
  .mode-card b { display: block; font-size: 14px; margin-bottom: 2px; }
  .mode-card span { font-size: 12px; color: var(--muted); }
  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 12px 20px; border-radius: 10px; cursor: pointer; margin-top: 12px;
    transition: opacity .15s, transform .05s;
  }
  .btn:hover:not(:disabled) { opacity: .9; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px;
    font-weight: 600; border: 1px solid var(--border); color: var(--muted);
  }
  .badge.running { color: var(--warn); border-color: var(--warn); }
  .badge.done { color: var(--ok); border-color: var(--ok); }
  .badge.error { color: var(--err); border-color: var(--err); }
  .badge.idle { color: var(--muted); border-color: var(--border); }
  .logbox {
    width: 100%; height: 300px; background: #0a0e18; color: #c8d6ea;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-family: inherit; font-size: 12px; line-height: 1.5; overflow: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  .progress-line {
    margin-top: 8px; padding: 8px 12px; background: #0d1220;
    border: 1px solid var(--accent); border-radius: 8px;
    color: var(--accent); font-size: 12px; font-family: inherit;
    white-space: pre-wrap; word-break: break-all; min-height: 1.4em;
  }
  #statusLine { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  video { width: 100%; border-radius: 10px; background: #000; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  a.dl { color: var(--accent); text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
  .err-box { color: var(--err); border: 1px solid var(--err); padding: 10px; border-radius: 8px; }
  #videosList { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow: auto; }
  #videosList a { color: var(--accent); text-decoration: none; font-size: 13px; }
  #videosList a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>LTX-2.5 Video Generation</h1>
  <p>Intel Arc B70 (XPU) &middot; 8-step (distilled) or 50-step (two-stage) &middot; server-side state</p>
</header>

<div class="wrap">
  <div class="card">
    <h2>Generate</h2>
    <div id="statusLine">
      <span class="badge idle" id="statusBadge">idle</span>
      <span class="meta" id="jobMeta"></span>
    </div>
    <label>Mode</label>
    <div class="mode-group">
      <label class="mode-card selected" id="card8">
        <input type="radio" name="mode" value="8" checked>
        <b>8 steps</b><span>Fast &middot; distilled model</span>
      </label>
      <label class="mode-card" id="card50">
        <input type="radio" name="mode" value="50">
        <b>50 steps</b><span>High quality &middot; two-stage + LoRA</span>
      </label>
    </div>
    <div style="margin-top:14px;">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="4" placeholder="Describe the video you want..."></textarea>
    </div>
    <button class="btn" id="genBtn">Generate</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Live Log</h2>
      <div class="logbox" id="logBox"></div>
      <div id="progressLine" class="progress-line"></div>
      <div class="meta" style="margin-top:6px;">Auto-scrolling &middot; updates during generation</div>
    </div>
    <div class="card">
      <h2>Result</h2>
      <div id="resultArea"><p class="meta">No video generated yet.</p></div>
    </div>
  </div>

  <div class="card">
    <h2>Generated Videos</h2>
    <div id="videosList"><p class="meta">Loading...</p></div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = { seq: 0, status: "idle", poll: null };

function setStatus(s) {
  const b = $("statusBadge");
  b.className = "badge " + (s || "idle");
  b.textContent = s || "idle";
  $("genBtn").disabled = (s === "running");
}

async function startJob() {
  const prompt = $("prompt").value.trim();
  const mode = document.querySelector('input[name="mode"]:checked').value;
  if (!prompt) { alert("Please enter a prompt."); return; }
  // Flip to running immediately on click for instant feedback.
  setStatus("running");
  $("logBox").textContent = "";
  $("progressLine").textContent = "";
  $("resultArea").innerHTML = '<p class="meta">Generating...</p>';
  try {
    const r = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode, prompt }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      setStatus("idle");
      $("resultArea").innerHTML = '<div class="err-box">Failed to start: ' +
        (e.detail || r.statusText) + '</div>';
      alert("Failed to start: " + (e.detail || r.statusText));
      return;
    }
    const d = await r.json();
    $("jobMeta").textContent = "job " + d.job_id + " started";
    state.seq = 0;               // fresh log view for this job
    startPolling();
  } catch (err) {
    setStatus("idle");
    alert("Network error: " + err);
  }
}

async function poll() {
  try {
    const [st, lg] = await Promise.all([
      fetch("/api/status").then(r => r.json()),
      fetch("/api/log?since=" + state.seq).then(r => r.json()),
    ]);
    // Append new log lines
    if (lg.lines && lg.lines.length) {
      const box = $("logBox");
      box.textContent += lg.lines.join("\n");
      state.seq = lg.seq;
    }
    // Live progress line (carriage-return updated), rendered as the last line.
    const live = lg.progress ? lg.progress.replace(/\s+/g, " ").trim() : "";
    if (live) {
      $("progressLine").textContent = live;
    } else {
      $("progressLine").textContent = "";
    }
    if (lg.lines && lg.lines.length || live) {
      $("logBox").scrollTop = $("logBox").scrollHeight;
    }
    setStatus(st.status);
    $("jobMeta").textContent = "job " + st.job_id +
      (st.started_at ? " · started " + st.started_at : "") +
      (st.finished_at ? " · finished " + st.finished_at : "");
    if (st.status === "done" && st.video) {
      showResult(st);
      refreshVideos();
    } else if (st.status === "error") {
      $("resultArea").innerHTML =
        '<div class="err-box">Generation failed: ' + (st.error || "unknown") + '</div>';
    }
    // stop polling when no longer running
    if (st.status !== "running") stopPolling();
  } catch (e) {
    /* transient; keep polling */
  }
}

function showResult(st) {
  const url = "/output/" + encodeURIComponent(st.video);
  $("resultArea").innerHTML =
    '<video controls autoplay muted src="' + url + '"></video>' +
    '<div class="meta">' + st.mode + '-step · ' + st.video +
    ' &middot; <a class="dl" href="' + url + '" download>Download</a></div>';
}

function startPolling() {
  stopPolling();
  state.poll = setInterval(poll, 500);
}
function stopPolling() {
  if (state.poll) { clearInterval(state.poll); state.poll = null; }
}

async function refreshVideos() {
  try {
    const vids = await fetch("/api/videos").then(r => r.json());
    const el = $("videosList");
    if (!vids.length) { el.innerHTML = '<p class="meta">No videos yet.</p>'; return; }
    el.innerHTML = vids.map(v =>
      '<a href="/output/' + encodeURIComponent(v) + '" target="_blank">' + v + '</a>'
    ).join("");
  } catch (e) { /* ignore */ }
}

// Mode card selection visuals
document.querySelectorAll(".mode-card").forEach(card => {
  card.addEventListener("click", () => {
    document.querySelectorAll(".mode-card").forEach(c => c.classList.remove("selected"));
    card.classList.add("selected");
  });
});

$("genBtn").addEventListener("click", startJob);

// Initial load
(async () => {
  try {
    const st = await fetch("/api/status").then(r => r.json());
    state.seq = st.log_seq;
    setStatus(st.status);
    if (st.status === "running") startPolling();
    if (st.video) showResult(st);
    refreshVideos();
  } catch (e) { /* server not ready */ }
})();
</script>
</body>
</html>
